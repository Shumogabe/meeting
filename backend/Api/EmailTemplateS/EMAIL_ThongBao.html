<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
    <meta charset="utf-8">
</head>

<body style="font-family: Arial, Sans Serif">

    <div style="min-width: 332px; max-width: 620px; border: 1px solid #e0e0e0; border-bottom: 0; border-top-left-radius: 3px; border-top-right-radius: 3px; background-color: #4184f3; color: #fff; padding-bottom: 15px; padding-top: 15px;">
        <div style="text-align: center">
            <h3 style="padding: 0 !important; margin-bottom: 0px;">%EMAIL_NAME%</h3>
        </div>
    </div>
    <div style="min-width: 332px; max-width: 600px; border: 1px solid #f0f0f0; border-bottom: 1px solid #c0c0c0; border-top: 0; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px; background-color: #fafafa; padding: 10px;">

        <span>Xin chào <strong>%USER_NAME%</strong> !</span>
        <p style="line-height: 25px;">
            %EMAIL_CONTENT%
        </p>
        <br>
        <br>

    </div>
    <small style="color: #333">Thư này được gửi tự động từ hệ thống thông báo, vui lòng không reply lại vào hòm thư này.</small>
    <br>
    <small style="color: #333">Thông tin liên hệ: %CONTACT_NAME%</small>
    <br>
    <small style="color: #bcbcbc; font-size: 11px">Địa chỉ: %CONTACT_ADDRESS%</small>
    <br>
    <small style="color: #bcbcbc; font-size: 11px">Điện thoại: %CONTACT_MOBILE%</small>
    <br>
    <small style="color: #bcbcbc; font-size: 11px">Email: %CONTACT_EMAIL%</small>
</body>

</html>
