<ion-header class="ion-no-border">
  <ion-toolbar color="transparent">
    <ion-buttons slot="end">
      <ion-button (click)="modalClose()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<div class="ion-padding pt-0">
  <div class="text-center">
    <h4 class="mt-0 mb-4 fw-700">Tạo phòng họp</h4>
  </div>
  <div class="mt-4">
    <div class="fw-600 fs-16 mb-1">Tiêu đề <ion-text color="danger">*</ion-text></div>
    <ion-input #inputRoomName mode="md" fill="outline" clear-input="true" placeholder="Nhập tiêu đề" minlength="6" maxlength="100" [value]="dataForm.title" (ionChange)="changeTitle($event)"></ion-input>
  </div>
  <div class="mt-4 max-w-240">
    <ion-toggle labelPlacement="start" [checked]="isPwd" (ionChange)="changeIsPwd($event)">Mật khẩu</ion-toggle>
  </div>
  @if(isPwd){
  <div class="mt-2 max-w-240">
    <ion-input #inputRoomPwd mode="md" type="password" fill="outline" placeholder="******" minlength="6" maxlength="32" [value]="dataForm.password" (ionChange)="changePassword($event)">
      <ion-input-password-toggle slot="end" color="dark"></ion-input-password-toggle>
    </ion-input>
  </div>
  }

  <div class="mt-4">
    <ion-button color="primary" expand="block" (click)="submitRoomAdd()" [disabled]="submitRoomAdd_Disabled">
      <ion-label>Bắt đầu</ion-label>
    </ion-button>
  </div>
</div>
