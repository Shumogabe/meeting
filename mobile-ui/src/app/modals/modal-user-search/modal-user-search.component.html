<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="end">
      <ion-button (click)="modalClose()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar color="light">
    <ion-searchbar inputmode="search" placeholder="Nhập thông tin tìm kiếm" [value]="filter.search" (ionInput)="searchChange($event)" [debounce]="1000" show-cancel-button="never"></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresherChange($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if(!listData.length){
  <div class="py-5">
    <div class="d-flex align-items-center justify-content-center data-not-found">
      <div>
        <div class="d-flex justify-content-center">
          <ion-img class="w-40" src="../../../assets/image/no-documents.svg"></ion-img>
        </div>
        <div class="mt-2 text-center">{{'DataNotFound'|translate}}</div>
      </div>
    </div>
  </div>
  }
  @else {
  <div class="ion-padding">
    <ng-container [ngTemplateOutlet]="templateList"></ng-container>
  </div>
  }

  <ion-infinite-scroll (ionInfinite)="infiniteChange($event)" *ngIf="paging.active">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<ng-template #templateList>
  <ion-list lines="none">

    @for(item of listData; track item){
    <ion-item color="light" button="true" detail="false" (click)="modalSubmit(item)">
      <ion-label>
        <b>{{item.ten_day_du?.trim()||item.ten_dangnhap}}</b>
        <div class="fs-14">
          <ion-text color="medium">{{item.email}}</ion-text>
        </div>
        @if(item.thong_tin_don_vi){
        <div class="fs-14">
          <ion-text color="medium">{{item.thong_tin_don_vi.ten}}</ion-text>
        </div>
        }
      </ion-label>
    </ion-item>
    }

  </ion-list>
</ng-template>
