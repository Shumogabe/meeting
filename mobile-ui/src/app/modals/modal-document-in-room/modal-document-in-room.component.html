<ion-header>
  <!-- <ion-toolbar color="light">
    <ion-buttons slot="end">
      <ion-button (click)="modalClose()">
        <ion-icon name="close-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar> -->
  <div class="d-flex align-items-center">
    <div class="flex-grow-1 min-h-48">
      <!-- <ion-searchbar inputmode="search" placeholder="Nhập thông tin tìm kiếm" [value]="filter.search" (ionInput)="searchChange($event)" [debounce]="1000" show-cancel-button="never"></ion-searchbar> -->
    </div>
    <ion-button size="small" color="medium" fill="clear" (click)="modalClose()">
      <ion-icon class="fs-24" name="close-outline"></ion-icon>
    </ion-button>
  </div>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="refresherChange($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  @if(!listData.length){
  <div class="py-5">
    <div class="d-flex align-items-center justify-content-center data-not-found">
      <div>
        <div class="d-flex justify-content-center">
          <ion-img class="w-40" src="../../../assets/image/no-documents.svg"></ion-img>
        </div>
        <div class="mt-2 text-center">{{'DataNotFound'|translate}}</div>
      </div>
    </div>
  </div>
  }
  @else {
  <div class="ion-padding">
    <ng-container [ngTemplateOutlet]="templateList"></ng-container>
  </div>
  }

  <ion-infinite-scroll (ionInfinite)="infiniteChange($event)" *ngIf="paging.active">
    <ion-infinite-scroll-content></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>

<ng-template #templateList>
  <ion-list lines="none">

    @for(item of listData; track item){
    <div class="card-item mb-3">
      <ion-item button="true" detail="false" (click)="presentModalDocumentDetail(item.fileOriginalName,item.fileType,item.fileUrl)">
        <ion-icon slot="start" class="fs-24" color="primary" name="folder-outline"></ion-icon>
        <ion-label>{{item.title}}</ion-label>
      </ion-item>

      <hr class="border-top border-dashed my-0" />

      <div class="d-flex align-item-center justify-content-end mx-1">
        <ion-button class="min-w-120" size="small" color="primary" fill="outline" (click)="downloadDocument(item)">
          <ion-label>{{'Download'|translate}}</ion-label>
        </ion-button>
      </div>
    </div>
    }

  </ion-list>
</ng-template>
